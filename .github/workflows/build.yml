name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek (otomatis unzip jika yang diunggah file ZIP)
        run: |
          if [ -z "$(find . -maxdepth 3 -name settings.gradle | head -n 1)" ]; then
            Z=$(ls *.zip | head -n 1)
            echo "Membuka $Z"
            mkdir -p _src
            unzip -q "$Z" -d _src
          fi
          S=$(find . -maxdepth 4 -name settings.gradle | head -n 1)
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Sholatku-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
